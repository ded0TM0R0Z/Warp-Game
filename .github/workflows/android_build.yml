name: Android Build

on:
    push:
        branches:
            - main
        paths:
            - "**.gradle.kts"
            - "gradle.properties"
            - "app/**"
            - "gradle/**"
            - ".github/workflows/android_build.yml"
    pull_request:
        branches:
            - main
        paths:
            - "**.gradle.kts"
            - "gradle.properties"
            - "app/**"
            - "gradle/**"
            - ".github/workflows/android_build.yml"
    workflow_dispatch:

concurrency:
    group: android-build-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    build:
        name: Build debug APK
        runs-on: ubuntu-latest
        timeout-minutes: 25

        steps:
            - name: Checkout repository
              uses: actions/checkout@v5

            - name: Set up JDK 17
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: "17"

            - name: Set up Android SDK
              uses: android-actions/setup-android@v3
              with:
                  packages: platform-tools

            - name: Install Android SDK packages
              run: |
                  sdkmanager "platforms;android-36" "build-tools;36.0.0"

            - name: Set up Gradle 8.13
              uses: gradle/actions/setup-gradle@v6
              with:
                  gradle-version: "8.13"
                  cache-provider: basic

            - name: Prepare stable signing key
              if: ${{ github.event_name != 'pull_request' }}
              env:
                  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
                  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
              run: |
                  set -euo pipefail

                  if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
                    echo "::error::Missing repository secret: ANDROID_KEYSTORE_BASE64"
                    exit 1
                  fi
                  if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
                    echo "::error::Missing repository secret: ANDROID_KEYSTORE_PASSWORD"
                    exit 1
                  fi
                  if [ -z "$ANDROID_KEY_ALIAS" ]; then
                    echo "::error::Missing repository secret: ANDROID_KEY_ALIAS"
                    exit 1
                  fi
                  if [ -z "$ANDROID_KEY_PASSWORD" ]; then
                    echo "::error::Missing repository secret: ANDROID_KEY_PASSWORD"
                    exit 1
                  fi

                  mkdir -p "$RUNNER_TEMP/warp-signing"
                  printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/warp-signing/warp-game.p12"
                  chmod 600 "$RUNNER_TEMP/warp-signing/warp-game.p12"
                  test -s "$RUNNER_TEMP/warp-signing/warp-game.p12"
                  keytool -list -keystore "$RUNNER_TEMP/warp-signing/warp-game.p12" -storetype PKCS12 -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null
                  echo "Stable signing key found, decoded, and validated."

            - name: Build debug APK
              env:
                  WARP_KEYSTORE_FILE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && github.event_name != 'pull_request' && format('{0}/warp-signing/warp-game.p12', runner.temp) || '' }}
                  WARP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  WARP_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                  WARP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
              run: gradle --no-daemon --stacktrace assembleDebug

            - name: Upload debug APK
              uses: actions/upload-artifact@v4
              with:
                  name: warp-game-debug-apk
                  path: app/build/outputs/apk/debug/*.apk
                  if-no-files-found: error
                  retention-days: 7
