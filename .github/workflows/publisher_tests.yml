name: Publisher Tests

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/publisher_tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/publisher_tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Validate game package publisher
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run publisher tests
        run: python -m unittest discover -s tools/tests -v
