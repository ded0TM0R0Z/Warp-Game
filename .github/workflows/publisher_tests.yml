name: Publisher Tests

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "games/**"
      - ".github/workflows/publisher_tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/**"
      - "games/**"
      - ".github/workflows/publisher_tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Validate game package publisher
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run publisher tests
        run: python -m unittest discover -s tools/tests -v
      - name: Check game JavaScript syntax
        run: node --check games/com.warp.riftsurvivors/scripts/game.js
      - name: Read game version
        id: game
        run: echo "version=$(python -c 'import json; print(json.load(open("games/com.warp.riftsurvivors/manifest.json"))["version"])')" >> "$GITHUB_OUTPUT"
      - name: Validate and package game
        run: python tools/publish_game.py package --game-dir games/com.warp.riftsurvivors --output "/tmp/com.warp.riftsurvivors-\${{ steps.game.outputs.version }}.zip" --game-id com.warp.riftsurvivors --version "\${{ steps.game.outputs.version }}"
